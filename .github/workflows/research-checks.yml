name: Research configuration checks

on:
  pull_request:
  push:
    branches: [main, prepare/open-source-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight validation dependencies
        run: python -m pip install PyYAML Jinja2 numpy pandas sympy pytest
      - name: Check paper configurations and source behavior
        run: python scripts/validate_paper_release.py
      - name: Check answer scoring and jailbreak judging offline
        run: python -m pytest -q tests/test_reasoning_workflow.py tests/test_judge_jailbreak_script.py
