task: arc__identify_uninformative
dataset_path: soheeyang/UnhelpfulThoughts
dataset_name: arc
output_type: generate_until
training_split: train
validation_split: validation
test_split: test
fewshot_split: train
doc_to_text: "Given a question and a thinking process, determine whether the thinking process contains the detailed information necessary to solve the actual question or it is just mere rambling which is uninformative. Answer with \\boxed{yes} if it is informative and \\boxed{no} if it is rambling. Make sure not to solve the given question yourself.\n\nQuestion: {{question.strip()}}\n\n(A) {{choices.text[0]}}\n(B) {{choices.text[1]}}\n(C) {{choices.text[2]}}{% if choices.text|length > 3 %}\n(D) {{choices.text[3]}}{% endif %}\n\nThinking Process: {{uninformative_thought}}"
fewshot_delimiter: "\n\n"
doc_to_target: "no"
prompt_suffix: "<｜Assistant｜><think>\nOkay, so I need to figure out whether the thinking process provided"
num_fewshot: 0
generation_kwargs:
  until:
    - "</s>"
    - "<|eot_id|>"
    - "<｜end▁of▁sentence｜>"
    - "<|im_end|>"
  do_sample: true
  temperature: 0.6
metric_list:
      - metric: exact_match
        aggregation: mean
        higher_is_better: true
        ignore_case: true
        ignore_punctuation: true
        regexes_to_ignore:
          - ","
          - "\\$"
          - "(?s).*#### "
          - "\\.$"  
          - "\\s+" 
filter_list:
      - name: get_response
        filter:
          - function: "r1_mcqa_last" 
metadata:
  version: 1.0
